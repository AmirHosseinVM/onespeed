name: Build OneSpeed APK (Kotlin)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ONESPEED_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch pinned Xray-core AAR (real Xray, reality/xhttp supported)
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 4 -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.28/libv2ray.aar

      - name: Fetch Vazirmatn font (matches the approved UI mockup)
        run: |
          mkdir -p app/src/main/res/font
          base="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@latest/fonts/ttf"
          curl -L --fail --retry 4 -o app/src/main/res/font/vazir_regular.ttf "$base/Vazirmatn-Regular.ttf"
          curl -L --fail --retry 4 -o app/src/main/res/font/vazir_medium.ttf "$base/Vazirmatn-Medium.ttf"
          curl -L --fail --retry 4 -o app/src/main/res/font/vazir_semibold.ttf "$base/Vazirmatn-SemiBold.ttf"
          curl -L --fail --retry 4 -o app/src/main/res/font/vazir_bold.ttf "$base/Vazirmatn-Bold.ttf"
          curl -L --fail --retry 4 -o app/src/main/res/font/vazir_extrabold.ttf "$base/Vazirmatn-ExtraBold.ttf"

      - name: Fetch geosite.dat / geoip.dat (routing rules need these — every built-in routing preset references geosite:/geoip: categories, and Xray refuses to start without the matching database file)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 4 -o app/src/main/assets/geoip.dat \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -L --fail --retry 4 -o app/src/main/assets/geosite.dat \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat

      - name: Set up Android NDK (needed to build hev-socks5-tunnel from source)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build hev-socks5-tunnel.so (tun2socks — no prebuilt binary exists, must compile)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel /tmp/hevtun
          mkdir -p /tmp/hevbuild/jni
          ln -s /tmp/hevtun /tmp/hevbuild/jni/hev-socks5-tunnel
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=/tmp/hevbuild \
            APP_BUILD_SCRIPT=/tmp/hevtun/Android.mk \
            APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT=/tmp/hevbuild/libs \
            NDK_OUT=/tmp/hevbuild/obj \
            APP_CFLAGS="-O3 -DPKGNAME=com/v2ray/ang/service" \
            APP_LDFLAGS="-Wl,--build-id=none -Wl,--hash-style=gnu"
          mkdir -p app/src/main/jniLibs
          cp -r /tmp/hevbuild/libs/* app/src/main/jniLibs/
          find app/src/main/jniLibs -name "*.so"

      - name: Decode signing key (only if configured in repo secrets)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ONESPEED_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/onespeed-release.jks"
          echo "ONESPEED_KEYSTORE=$GITHUB_WORKSPACE/onespeed-release.jks" >> "$GITHUB_ENV"
          echo "ONESPEED_KEYSTORE_PASSWORD=${{ secrets.ONESPEED_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ONESPEED_KEY_ALIAS=${{ secrets.ONESPEED_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ONESPEED_KEY_PASSWORD=${{ secrets.ONESPEED_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: onespeed-apk
          path: app/build/outputs/apk/release/app-release.apk
