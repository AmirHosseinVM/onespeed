name: Generate OneSpeed release keystore (run once)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore + random passwords
        run: |
          set -e
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          ALIAS="onespeed"

          keytool -genkeypair -v \
            -keystore onespeed-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=OneSpeed, OU=OneSpeed, O=OneSpeed, L=Tehran, ST=Tehran, C=IR"

          base64 -w0 onespeed-release.jks > onespeed-release.b64

          {
            echo "ONESPEED_KEYSTORE_BASE64 (paste this whole line's value, i.e. the file's content):"
            echo "  -> see onespeed-release.b64 in this artifact"
            echo ""
            echo "ONESPEED_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ONESPEED_KEY_ALIAS=$ALIAS"
            echo "ONESPEED_KEY_PASSWORD=$KEY_PASS"
          } > secrets-to-add.txt

          mkdir -p out
          mv onespeed-release.jks onespeed-release.b64 secrets-to-add.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: onespeed-keystore
          path: out/
          retention-days: 1
